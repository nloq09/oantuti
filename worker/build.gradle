plugins { id 'java'; id 'application' }
group = 'com.rpsbattle'
version = '0.11.0'
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
if (System.getProperty('os.name').startsWith('Windows')) {
    def key = Integer.toUnsignedString(projectDir.canonicalPath.hashCode(), 16)
    layout.buildDirectory.set(new File(gradle.gradleUserHomeDir, "rps-battle-builds/worker-${key}"))
}
repositories { mavenCentral() }

// Compile the exact headless domain/protocol/replay sources used by Central. No Spring/server boot dependency.
sourceSets.main.java {
    srcDir '../server/src/main/java'
    include 'com/rpsbattle/remote/**', 'com/rpsbattle/game/**', 'com/rpsbattle/rule/**',
            'com/rpsbattle/rules/**', 'com/rpsbattle/agent/**', 'com/rpsbattle/match/**',
            'com/rpsbattle/bot/Bot*.java', 'com/rpsbattle/replay/MatchLog.java',
            'com/rpsbattle/replay/ReplayJson.java', 'com/rpsbattle/replay/ReplayService.java',
            'com/rpsbattle/online/OnlineMatch.java', 'com/rpsbattle/online/MatchMode.java',
            'com/rpsbattle/online/DemoRequestException.java'
}
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'com.rpsbattle.remote.WorkerApplication' }
test { useJUnitPlatform() }
tasks.register('workerJar', Jar) {
    archiveFileName = 'rps-worker.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
    doLast { logger.lifecycle("Worker JAR: ${archiveFile.get().asFile.absolutePath}") }
}
