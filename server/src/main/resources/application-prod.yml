spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
