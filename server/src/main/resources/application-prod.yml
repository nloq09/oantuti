spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_REGEX:172[.]30[.]90[.][0-9]+}
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

rps:
  bots:
    directory: ${BOT_DIRECTORY:data/bots}
    enabled: ${BOTS_ENABLED:false}
    docker-volume: ${BOT_DOCKER_VOLUME:}
    instance-key: ${RPS_INSTANCE_KEY:local}
