spring:
  application:
    name: rps-battle
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  compression:
    enabled: true
    mime-types: text/css,text/javascript,application/javascript
    min-response-size: 1024
  shutdown: graceful
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

rps:
  worker:
    max-concurrent-matches: ${MAX_CONCURRENT_MATCHES:4}
    max-pending-matches: ${MAX_PENDING_MATCHES:256}
  rate-limit:
    max-keys: 10000
    multiplier: ${RATE_LIMIT_MULTIPLIER:1}
  replays:
    directory: ${REPLAY_DIRECTORY:data/replays}
    flush-millis: 500
  tournament:
    max-concurrent-matches: 4
    match-timeout-seconds: 900

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
