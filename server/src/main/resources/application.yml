spring:
  application:
    name: rps-battle
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

rps:
  tournament:
    max-concurrent-matches: 4
    match-timeout-seconds: 900
