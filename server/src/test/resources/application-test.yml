spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 2
server:
  address: 127.0.0.1
rps:
  rate-limit:
    # Shared integration contexts exercise many independent flows from one localhost IP.
    # OperationsSecurityTest explicitly restores production quotas for rate-limit assertions.
    multiplier: 100
  replays:
    directory: ${java.io.tmpdir}/rps-replays-${random.uuid}
