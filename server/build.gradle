plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.rpsbattle'
version = '1.0-SNAPSHOT'

// Windows sync/indexing can lock class directories inside OneDrive checkouts.
// Keep a stable, checkout-specific build directory outside the source tree.
if (System.getProperty('os.name').startsWith('Windows')) {
    def projectKey = Integer.toUnsignedString(projectDir.canonicalPath.hashCode(), 16)
    layout.buildDirectory.set(new File(gradle.gradleUserHomeDir, "rps-battle-builds/${projectKey}"))
}

tasks.register('printBuildDir') {
    doLast { logger.lifecycle(layout.buildDirectory.get().asFile.absolutePath) }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep Stage 1's local CLI separate from the online server entry point.
application {
    mainClass = 'com.rpsbattle.app.LocalGameApplication'
}

// The application plugin supplies the CLI main class to Boot tasks as well,
// so override each server task explicitly.
tasks.named('bootRun') {
    mainClass = 'com.rpsbattle.RpsBattleApplication'
}

tasks.named('bootJar') {
    mainClass = 'com.rpsbattle.RpsBattleApplication'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}

tasks.named('processResources') {
    from('../client') { into 'static' }
}

test {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
    }
}
