plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.rpsbattle'
version = '1.0-SNAPSHOT'

// Windows sync/indexing can lock class directories inside OneDrive checkouts.
// Keep a stable, checkout-specific build directory outside the source tree.
if (System.getProperty('os.name').startsWith('Windows')) {
    def projectKey = Integer.toUnsignedString(projectDir.canonicalPath.hashCode(), 16)
    layout.buildDirectory.set(new File(gradle.gradleUserHomeDir, "rps-battle-builds/${projectKey}"))
}

tasks.register('printBuildDir') {
    doLast { logger.lifecycle(layout.buildDirectory.get().asFile.absolutePath) }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep Stage 1's local CLI separate from the online server entry point.
application {
    mainClass = 'com.rpsbattle.app.LocalGameApplication'
}

// The application plugin supplies the CLI main class to Boot tasks as well,
// so override each server task explicitly.
tasks.named('bootRun') {
    mainClass = 'com.rpsbattle.RpsBattleApplication'
}

tasks.named('bootJar') {
    mainClass = 'com.rpsbattle.RpsBattleApplication'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}

// A deployment gets one content-derived namespace for its complete module graph.
// Relative imports stay inside that namespace; legacy unversioned URLs revalidate.
def frontendSources = fileTree('../client') {
    include '**/*.html', 'js/**/*.js', 'css/**/*.css'
}
def frontendDigest = java.security.MessageDigest.getInstance('SHA-256')
frontendSources.files.sort { a, b -> a.path <=> b.path }.each { source ->
    frontendDigest.update(file('../client').toPath().relativize(source.toPath()).toString().replace('\\', '/').getBytes('UTF-8'))
    frontendDigest.update((byte) 0)
    frontendDigest.update(source.bytes)
}
def frontendVersion = frontendDigest.digest().encodeHex().toString().substring(0, 16)
def versionFrontendLine = { String line ->
    line.replace('/js/', "/ui/${frontendVersion}/js/")
        .replace('/css/', "/ui/${frontendVersion}/css/")
}
def frontendResources = tasks.register('frontendResources', Sync) {
    into layout.buildDirectory.dir('generated/frontend')
    inputs.property('frontendVersion', frontendVersion)
    filteringCharset = 'UTF-8'
    from('../client') {
        exclude 'tests/**', 'package.json', 'package-lock.json'
        filesMatching('**/*.html') { filter(versionFrontendLine) }
    }
    from('../client') {
        include 'js/**/*.js', 'css/**/*.css'
        into "ui/${frontendVersion}"
        filter(versionFrontendLine)
    }
}

tasks.named('processResources') {
    from(frontendResources) { into 'static' }
    doFirst {
        def uiRoot = destinationDir.toPath().toAbsolutePath().normalize().resolve('static/ui')
        if (!uiRoot.startsWith(layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize())) {
            throw new GradleException('Versioned UI cleanup must remain inside the build directory')
        }
        delete uiRoot.toFile()
    }
    dependsOn ':worker:workerJar'
    from({ project(':worker').tasks.named('workerJar').get().archiveFile.get().asFile }) { into 'worker-distribution' }
}

test {
    useJUnitPlatform { excludeTags 'remote-load' }
    systemProperty 'spring.profiles.active', 'test'
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
    }
}

tasks.register('remoteLoadTest', Test) {
    description = 'Synthetic 4000-entrant/10-worker/80-slot control-plane benchmark (not Docker throughput)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'remote-load' }
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'rps.load.report', layout.buildDirectory.file('reports/remote-load.json').get().asFile.absolutePath
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = false }
    maxHeapSize = '1536m'
    outputs.upToDateWhen { false }
}
