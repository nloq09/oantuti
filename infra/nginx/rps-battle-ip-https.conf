# Install only after the rps-battle-ip certificate exists.
# Replace __PUBLIC_IP__ before installing; include inside Nginx's http context.
map $http_upgrade $rps_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name __PUBLIC_IP__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://__PUBLIC_IP__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __PUBLIC_IP__;

    ssl_certificate /etc/letsencrypt/live/rps-battle-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rps-battle-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rps_connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
