# Bootstrap ACME HTTP validation. Replace __PUBLIC_IP__ before installing.
server {
    listen 80;
    server_name __PUBLIC_IP__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
