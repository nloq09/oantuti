name: ${COMPOSE_PROJECT_NAME:-rpsbattle}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rpsbattle}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME to a separate app role}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-rps.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  rps-server:
    image: ${RPS_IMAGE:-rps-battle:local}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rpsbattle}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      BOT_DIRECTORY: /app/data/bots
      REPLAY_DIRECTORY: /app/data/replays
      BOTS_ENABLED: ${BOTS_ENABLED:-false}
      BOT_DOCKER_VOLUME: ${COMPOSE_PROJECT_NAME:-rpsbattle}-bot-data
      RPS_INSTANCE_KEY: ${COMPOSE_PROJECT_NAME:-rpsbattle}
      MAX_CONCURRENT_MATCHES: ${MAX_CONCURRENT_MATCHES:-4}
      MAX_PENDING_MATCHES: ${MAX_PENDING_MATCHES:-256}
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/tmp
      TRUSTED_PROXY_REGEX: ${TRUSTED_PROXY_REGEX:-172[.]30[.]90[.][0-9]+}
    volumes:
      - bot-data:/app/data/bots
      - replay-data:/app/data/replays
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    restart: unless-stopped
    networks: [backend]
  reverse-proxy:
    image: caddy:2-alpine
    environment:
      RPS_DOMAIN: ${RPS_DOMAIN:?Set RPS_DOMAIN to your DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      rps-server:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]
  maintenance:
    image: postgres:17-alpine
    profiles: [operations]
    network_mode: none
    volumes:
      - bot-data:/data/bots
      - replay-data:/data/replays
    entrypoint: ["/bin/sh"]
    command: ["-c", "echo Use tools/ops.py for backup and restore"]
volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-rpsbattle}-postgres-data
  bot-data:
    name: ${COMPOSE_PROJECT_NAME:-rpsbattle}-bot-data
  replay-data:
    name: ${COMPOSE_PROJECT_NAME:-rpsbattle}-replay-data
  caddy-data:
  caddy-config:
networks:
  backend:
    ipam:
      config:
        - subnet: ${RPS_SUBNET:-172.30.90.0/24}
