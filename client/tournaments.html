<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Giải đấu · RPS Battle</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/battle-theme.css" />
    <link rel="stylesheet" href="/css/tournament.css" />
    <link rel="stylesheet" href="/css/account.css">
  </head>
  <body>
    <nav class="account-nav site-account-nav" data-account-nav aria-label="Điều hướng"><a class="button" href="/">Trang chủ</a><div class="account-actions"><a class="button" href="/login.html">Đăng nhập</a><a class="button" href="/register.html">Đăng ký</a></div></nav>
    <main class="tournament-page">
      <div class="tournament-grid">
        <section class="panel">
          <h2>Tạo giải đấu</h2>
          <p id="tournament-account-notice" role="status"></p><form id="create-tournament">
            <label for="tournament-name">Tên giải đấu</label
            ><input
              id="tournament-name"
              required
              maxlength="80"
              placeholder="RPS Championship"
            />
            <label for="tournament-format">Thể thức</label><select id="tournament-format"><option value="ROUND_ROBIN">Vòng tròn (Round Robin)</option><option value="SINGLE_ELIMINATION">Loại trực tiếp (Single Elimination)</option></select>
            <label for="match-concurrency">Số trận chạy đồng thời</label><input id="match-concurrency" type="number" min="1" max="4" value="2" required />
            <label for="max-participants">Số bot tối đa</label><input id="max-participants" type="number" min="2" max="32" value="10" required />
            <label><input id="check-in-required" type="checkbox" /> Yêu cầu người tham gia check-in trước khi bắt đầu</label>
            <h3>Bot của bạn (không bắt buộc)</h3>
            <div id="bot-options"></div>
            <p id="bot-empty" hidden>
              Bạn có thể tạo giải trước rồi mời mọi người đăng ký bot.
              <a href="/bots.html">Đi tới Bot của tôi →</a>
            </p>
            <button class="primary wide" id="create">Tạo giải đấu</button>
          </form>
          <h2>Tham gia giải đấu</h2>
          <form id="join-tournament">
            <label for="tournament-code">Mã giải hoặc link mời</label>
            <input id="tournament-code" required placeholder="Dán mã giải hoặc link mời" />
            <button class="primary wide">Tham gia</button>
          </form>
        </section>
        <section>
          <h2>Các giải đấu</h2>
          <div id="tournament-list" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/js/tournament/tournament-list.js?v=rounds-v4"></script>
    <script type="module" src="/js/pages/account-nav.js"></script>
  </body>
</html>
