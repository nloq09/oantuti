<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyệt đăng ký · RPS Battle</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/battle-theme.css"><link rel="stylesheet" href="/css/account.css"><link rel="stylesheet" href="/css/tournament.css"><link rel="stylesheet" href="/css/tournament-mode.css"><link rel="stylesheet" href="/css/organizer-control-center.css"></head><body><nav class="account-nav site-account-nav" data-account-nav aria-label="Điều hướng"></nav><main class="tournament-page"><h1>Đăng ký người chơi</h1><a id="back-to-tournament" class="button">← Quản lý giải</a><section id="registration-dashboard" aria-label="Dashboard đăng ký"></section><section class="registration-queue" aria-labelledby="application-queue-heading"><h2 id="application-queue-heading" tabindex="-1">Danh sách đăng ký</h2><p id="application-queue-count" role="status"></p><form id="application-filters" class="registration-filters" aria-label="Lọc đơn đăng ký"><label>Trạng thái<select id="application-status"><option value="">Tất cả</option><option value="NEEDS_REVIEW">Cần xác nhận</option><option value="APPROVED">Đã chấp nhận</option><option value="WAITLISTED">Danh sách chờ</option><option value="REJECTED">Bị từ chối</option><option value="CANCELLED">Đã hủy</option></select></label><label>Tài khoản / Tên hiển thị<input id="filter-search" maxlength="80" type="search" placeholder="Tìm người đăng ký"></label><label>Trường / Đơn vị<input id="filter-affiliation" maxlength="80" type="search"></label><label>Ngôn ngữ<select id="filter-language"><option value="">Tất cả</option><option value="CPP">C++</option><option value="PYTHON">Python</option><option value="JAVA">Java</option></select></label><label>Lý do cần xử lý<select id="filter-reason"><option value="">Tất cả</option></select></label><label>Gửi từ (giờ máy bạn)<input id="filter-from" type="datetime-local"></label><label>Gửi trước (giờ máy bạn)<input id="filter-until" type="datetime-local"></label><label>Số đơn mỗi trang<select id="filter-size"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></label><div class="actions"><button type="submit">Áp dụng bộ lọc</button><button type="button" id="clear-application-filters">Xóa bộ lọc</button><button type="button" id="refresh-applications">Cập nhật danh sách</button></div></form><section id="bulk-review-result" role="status" aria-label="Kết quả xét duyệt hàng loạt"></section><section id="bulk-review-controls" aria-label="Xét duyệt nhiều đơn"></section><p id="review-notice" role="status"></p><section id="applications">Đang tải…</section></section></main><script type="module" src="/js/pages/account-nav.js"></script><script type="module" src="/js/tournament/application-review.js"></script></body></html>
