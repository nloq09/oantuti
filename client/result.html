<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kết quả · RPS Battle</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/battle-theme.css" />
    <link rel="stylesheet" href="/css/account.css">
  </head>
  <body>
    <header><a class="brand" href="/">◈ RPS BATTLE</a></header>
    <main class="hero result-screen panel">
<nav class="account-nav" data-account-nav aria-label="Điều hướng"><a class="button" href="/">Trang chủ</a></nav>
      <div class="result-emblem" aria-hidden="true">♛</div>
      <p class="eyebrow">KẾT QUẢ TRẬN ĐẤU</p>
      <h1 id="outcome">Kết quả</h1>
      <p id="summary"></p>
      <p id="remaining" class="muted"></p>
      <div class="result-stats">
        <div><span>Tổng lượt</span><strong id="result-turns">—</strong></div>
        <div>
          <span>Quân Xanh còn lại</span><strong id="result-p1">—</strong>
        </div>
        <div><span>Quân Đỏ còn lại</span><strong id="result-p2">—</strong></div>
      </div>
      <div class="actions">
        <button id="again" class="primary">Chơi ván mới</button
        ><button id="match-log">Nhật ký trận</button
        ><a id="replay-link" class="button" href="/replay.html">Replay đầy đủ</a
        ><a class="button" href="/">Trang chủ</a>
      </div>
    </main>
    <script type="module" src="/js/pages/result.js"></script>
    <script type="module" src="/js/pages/account-nav.js"></script>
  </body>
</html>
