<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hồ sơ · RPS Battle</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/battle-theme.css"><link rel="stylesheet" href="/css/account.css"></head>
<body><main class="account-page"><nav class="account-nav" data-account-nav aria-label="Điều hướng"><a class="button" href="/">Trang chủ</a></nav>
<h1>Hồ sơ của tôi</h1><p id="account-load-status" role="status">Đang tải tài khoản…</p>
<div data-protected-content hidden><div id="account-stats" class="account-stats" aria-label="Thống kê tài khoản"></div><p id="stats-status" role="status"></p>
<div class="account-columns"><section class="panel"><h2>Thông tin tài khoản</h2>
<dl class="account-details"><dt>Tên đăng nhập</dt><dd id="profile-username"></dd><dt>Email</dt><dd id="profile-email"></dd><dt>Vai trò</dt><dd id="profile-role"></dd><dt>Ngày tạo</dt><dd id="profile-createdAt"></dd><dt>Đăng nhập gần nhất</dt><dd id="profile-lastLoginAt"></dd></dl>
<form id="profile-form" class="account-form"><label>Tên hiển thị<input name="displayName" required maxlength="60" autocomplete="nickname"></label><p class="form-message" role="status" aria-live="polite"></p><button class="primary" type="submit">Lưu thay đổi</button></form></section>
<section class="panel"><h2>Đổi mật khẩu</h2><p>Đổi mật khẩu sẽ đăng xuất tất cả phiên hiện tại. Bạn cần đăng nhập lại.</p>
<form id="password-form" class="account-form"><label>Mật khẩu hiện tại<input name="currentPassword" type="password" required autocomplete="current-password"></label>
<label>Mật khẩu mới<input name="newPassword" type="password" required autocomplete="new-password"><small>Ít nhất 12 ký tự, tối đa 72 byte UTF-8.</small></label>
<label>Xác nhận mật khẩu mới<input name="confirmation" type="password" required autocomplete="new-password"></label><p class="form-message" role="status" aria-live="polite"></p><button class="primary" type="submit">Đổi mật khẩu</button></form></section></div>
<p><a class="button" href="/history.html">Xem lịch sử trận đấu →</a></p></div>
</main><script type="module" src="/js/pages/account-nav.js"></script><script type="module" src="/js/pages/profile.js"></script></body></html>
