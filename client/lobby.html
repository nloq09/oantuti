<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chọn trận · RPS Battle</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/lobby.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/">◈ RPS BATTLE</a
      ><button id="settings">Cài đặt</button>
    </header>
    <main class="lobby">
      <p class="eyebrow">CHỌN ĐỐI THỦ</p>
      <h1>Vào trận.</h1>
      <p class="muted">Tạo phòng mới hoặc tham gia bằng mã bạn bè gửi.</p>
      <div class="mode-grid">
        <button data-mode="HUMAN_VS_HUMAN" class="mode chosen">
          <strong>Hai người</strong
          ><span>Gửi mã phòng và cùng chơi trực tuyến</span></button
        ><button data-mode="HUMAN_VS_BOT" class="mode">
          <strong>Đấu với bot</strong
          ><span>Bot chiến thuật · Ưu tiên ăn quân và tránh nguy hiểm</span>
        </button>
      </div>
      <button class="primary wide" id="create">Tạo phòng →</button>
      <section class="panel">
        <h2>Đã có mã phòng?</h2>
        <form id="join-form">
          <label for="code">Mã phòng</label>
          <div class="actions">
            <input
              id="code"
              placeholder="VD: A1B2C3D4"
              required
              maxlength="8"
              autocomplete="off"
            /><button type="submit">Tham gia</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/js/pages/lobby.js"></script>
  </body>
</html>
