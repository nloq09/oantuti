<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RPS Battle</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/battle-theme.css" />
    <link rel="stylesheet" href="/css/account.css">
  </head>
  <body>
    <nav class="account-nav home-account-nav" data-account-nav="home" aria-label="Tài khoản">
      <a class="button" href="/login.html">Đăng nhập</a>
      <a class="button" href="/register.html">Đăng ký</a>
    </nav>
    <main class="hero">
      <span class="hero-mark" aria-hidden="true">♛</span>
      <p class="eyebrow">OẲN TÙ TÌ CHIẾN THUẬT</p>
      <h1>RPS BATTLE<span class="hero-size">9 × 9</span></h1>
      <p class="intro">
        Xếp đội hình, đọc ý đối thủ và làm chủ bàn cờ.<br />Một trận chiến quen
        thuộc, một cách chơi mới.
      </p>
      <div class="hero-pieces">
        <img src="/assets/pieces/rock-blue.svg" alt="Búa" /><img
          src="/assets/pieces/paper-red.svg"
          alt="Bao"
        /><img src="/assets/pieces/scissors-blue.svg" alt="Kéo" />
      </div>
      <div class="actions">
        <a class="button primary" href="/lobby.html">Bắt đầu chơi →</a
        ><a class="button gold-button" data-account-destination="/bots.html" href="/login.html?next=%2Fbots.html">Bot của tôi</a
        ><a class="button primary" data-account-destination="/tournaments.html" href="/login.html?next=%2Ftournaments.html">Giải đấu</a
        ><button id="help">Cách chơi</button
        ><button id="hero-settings">Cài đặt</button>
      </div>
    </main>
    <script type="module" src="/js/pages/home.js?v=2"></script>
    <script type="module" src="/js/pages/account-nav.js"></script>
  </body>
</html>
