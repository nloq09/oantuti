<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RPS Battle</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/">◈ RPS BATTLE</a
      ><button id="settings">Cài đặt</button>
    </header>
    <main class="hero">
      <p class="eyebrow">CHIẾN THUẬT · BÚA BAO KÉO</p>
      <h1>Ba loại quân.<br />Vô vàn nước đi.</h1>
      <p class="intro">
        Xếp đội hình, đọc ý đối thủ và làm chủ bàn cờ.<br />Một trận chiến quen
        thuộc, một cách chơi mới.
      </p>
      <div class="hero-pieces">
        <img src="/assets/pieces/rock-blue.svg" alt="Búa" /><img
          src="/assets/pieces/paper-red.svg"
          alt="Bao"
        /><img src="/assets/pieces/scissors-blue.svg" alt="Kéo" />
      </div>
      <div class="actions">
        <a class="button primary" href="/lobby.html">Bắt đầu chơi →</a
        ><button id="help">Cách chơi</button>
      </div>
      <p class="muted">2 người trực tuyến · Bot dễ · Bàn cờ 9 × 9</p>
    </main>
    <script type="module" src="/js/pages/home.js"></script>
  </body>
</html>
